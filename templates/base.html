<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}Document Center{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark shadow">

    <div class="container-fluid">

        <a class="navbar-brand fw-bold d-flex align-items-center" href="/">

            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo" class="me-2" style="height:32px; width:auto;">

            eL Hotel Yogyakarta

        </a>

        <div class="d-flex align-items-center">

            <span class="text-white me-3">

                Document Center

            </span>

            {% if user %}
            <a href="{{ url_for('logout') }}" class="btn btn-outline-light btn-sm d-flex align-items-center">

                <i class="bi bi-box-arrow-right me-1"></i>

                Logout ({{ user.fullname or user.username }})

                {% if user.role %}
                <span class="badge bg-secondary ms-2">{{ user.role }}</span>
                {% endif %}

            </a>
            {% else %}
            <a href="{{ url_for('login') }}" class="btn btn-outline-light btn-sm d-flex align-items-center">

                <i class="bi bi-box-arrow-in-right me-1"></i>

                Login

            </a>
            {% endif %}

        </div>

    </div>

</nav>

<div class="container-fluid mt-4">

    {% block content %}

    {% endblock %}

</div>

<footer class="text-center py-4">

    <div class="small text-muted">

        Developed by <strong>Stefanus WH</strong>

    </div>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

{% block scripts %}

{% endblock %}

</body>

</html>
