{% extends "base.html" %}

{% block title %}
Upload Dokumen - Document Center
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-6">

        <div class="card shadow-sm">

            <div class="card-header">
                <h4 class="mb-0">
                    <i class="bi bi-cloud-upload"></i>
                    Upload Dokumen
                </h4>
            </div>

            <div class="card-body">

                {% if error %}
                <div class="alert alert-danger">
                    {{ error }}
                </div>
                {% endif %}

                <form method="POST" enctype="multipart/form-data">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label">Pilih File</label>
                        <input type="file" name="documents" class="form-control" multiple required>
                        <div class="form-text">Pilih beberapa file sekaligus jika perlu.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Kategori Dokumen</label>
                        <input type="text" name="category" class="form-control" placeholder="Contoh: SOP, HR, Keuangan">
                        <div class="form-text">Kategori ini akan membantu filter dan pencarian.</div>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('documents') }}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left me-1"></i>
                            Kembali
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-upload me-1"></i>
                            Upload
                        </button>
                    </div>
                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
