{% extends 'base.html' %}

{% block title %}Edit Event - {{ event.name }}{% endblock %}

{% block content %}
<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card shadow-sm">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h5 class="mb-0">Edit Event</h5>
          <a href="{{ url_for('gallery_event', event_id=event.id) }}" class="btn btn-sm btn-secondary">Kembali</a>
        </div>
        <div class="card-body">
          {% if error %}
          <div class="alert alert-danger">{{ error }}</div>
          {% endif %}
          <form method="post">
            <div class="mb-3">
              <label class="form-label">Nama Event</label>
              <input class="form-control" name="name" value="{{ event.name }}" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Deskripsi</label>
              <textarea class="form-control" name="description" rows="3">{{ event.description }}</textarea>
            </div>
            <div class="mb-3">
              <label class="form-label">Kategori</label>
              <input class="form-control" name="category" value="{{ event.category or '' }}">
            </div>

            <div class="mb-3">
              <label class="form-label">Pilih Cover Foto</label>
              <div class="row g-2">
                {% for photo in photos %}
                <div class="col-3 text-center">
                  <label style="cursor:pointer">
                    <img src="{{ url_for('static', filename=photo.filename) }}" class="img-fluid rounded mb-1" style="height:90px; object-fit:cover; width:100%;">
                    <div>
                      <input type="radio" name="cover_photo" value="{{ photo.id }}" {% if event.cover_image and event.cover_image==photo.filename %}checked{% endif %}> Pilih
                    </div>
                  </label>
                </div>
                {% endfor %}
                {% if not photos %}
                <div class="col-12">
                  <div class="alert alert-secondary">Belum ada foto untuk memilih cover.</div>
                </div>
                {% endif %}
              </div>
            </div>

            <div class="d-flex justify-content-end">
              <button class="btn btn-primary" type="submit">Simpan Perubahan</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
